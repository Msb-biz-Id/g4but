# ================================================================
#  e-KASUARI — Template Nginx Production
#  Salin ke: /etc/nginx/sites-available/ekasuari
#  Aktifkan: ln -s /etc/nginx/sites-available/ekasuari \
#                   /etc/nginx/sites-enabled/ekasuari
#  Test    : nginx -t
#  Reload  : systemctl reload nginx
#
#  Sesuaikan bagian bertanda <ISI_INI> sebelum dipakai.
# ================================================================

# ── Rate limit zone (definisikan di level http{}, bukan server{}) ──
# Tambahkan baris ini di /etc/nginx/nginx.conf dalam blok http{} :
#   limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

# ── Redirect HTTP → HTTPS ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name <ISI_INI>;   # contoh: ekasuari.papua-barat.go.id

    # Let's Encrypt challenge (jangan dihapus)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Semua traffic HTTP diarahkan ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Server HTTPS Utama ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <ISI_INI>;   # contoh: ekasuari.papua-barat.go.id

    root /var/www/ekasuari/public;   # <ISI_INI> sesuaikan path
    index index.php;

    # ── SSL Certificate ──────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/<ISI_INI>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<ISI_INI>/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    # TLS modern (Mozilla Intermediate — kompatibel Android 4.4.2+, IE11+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Ukuran Upload (Evidence 10 MB + buffer) ──────────────────
    client_max_body_size 11M;
    client_body_timeout  30s;

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # ── Log ──────────────────────────────────────────────────────
    access_log /var/log/nginx/ekasuari-access.log;
    error_log  /var/log/nginx/ekasuari-error.log warn;

    # ── Blokir akses ke file sensitif ───────────────────────────
    # .env, .git, composer.json, dll. TIDAK boleh diakses publik
    location ~ /\.(env|git|htaccess|htpasswd|svn|DS_Store) {
        deny all;
        return 404;
    }
    location ~ ^/(composer\.(json|lock)|package\.json|phpunit\.xml|artisan) {
        deny all;
        return 404;
    }
    location ~ ^/(storage|bootstrap/cache) {
        deny all;
        return 403;
    }

    # ── Rate limit login (layer Nginx — cadangan dari Laravel throttle) ──
    location = /login {
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Rate limit API ───────────────────────────────────────────
    location ^~ /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Static assets (build Vite) ───────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # ── Health check (tidak di-log untuk mengurangi noise) ──────
    location = /health {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Semua request diteruskan ke Laravel ─────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.4-fpm.sock;  # sesuaikan versi PHP
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 60s;

        # Sembunyikan header versi PHP
        fastcgi_hide_header X-Powered-By;
    }

    # ── Hide server version ──────────────────────────────────────
    server_tokens off;

    # ── Security headers (backup dari SecurityHeaders.php) ──────
    # Laravel sudah mengirim header ini via middleware. Nginx menambahkannya
    # sebagai fallback untuk respons yang tidak melalui PHP (static files).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
