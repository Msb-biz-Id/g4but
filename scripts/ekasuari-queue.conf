[program:ekasuari-queue-default]
; ─── e-KASUARI Queue Worker — Supervisor Config ──────────────────────────────
; Salin file ini ke /etc/supervisor/conf.d/ekasuari-queue.conf
; Sesuaikan path /var/www/ekasuari dengan lokasi aplikasi di server Anda.
; Setelah disalin:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start ekasuari-queue-default:*

command=php /var/www/ekasuari/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --queue=default
directory=/var/www/ekasuari
autostart=true
autorestart=true
startretries=3
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
redirect_stderr=true
stdout_logfile=/var/log/ekasuari-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
